<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Моят профил – Skillo</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .profile-wrap{max-width:580px;margin:40px auto;padding:0 5vw}
    .profile-card-big{background:#fff;border-radius:var(--rl);padding:36px;box-shadow:var(--sh);border:1px solid var(--g200)}
    .avatar-section{display:flex;flex-direction:column;align-items:center;margin-bottom:32px}
    .big-avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--blue);background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer;transition:.2s;overflow:hidden;margin-bottom:12px}
    .big-avatar:hover{opacity:.85;transform:scale(1.03)}
    .big-avatar img{width:100%;height:100%;object-fit:cover}
    .avatar-hint{font-size:.8rem;color:var(--g500)}
    .info-row{background:var(--g100);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .info-row .label{font-size:.78rem;color:var(--g500);font-weight:700;text-transform:uppercase;min-width:80px}
    .info-row .value{font-size:.92rem;font-weight:600}
  </style>
</head>
<body>
<nav id="main-nav">
  <a href="/index.html" class="logo"><div class="logo-icon">🚀</div><span class="logo-text">Skill<span class="accent">o</span></span></a>
  <ul class="nav-links"></ul>
  <div class="nav-cta">
    <a href="#" id="nav-login-btn" class="btn btn-outline btn-sm" onclick="window.location='/index.html#login';return false">Вход</a>
    <a href="#" id="nav-register-btn" class="btn btn-orange btn-sm" onclick="window.location='/index.html#register';return false">Регистрация</a>
    <div id="nav-user" style="display:none;align-items:center;gap:8px">
      <div id="nav-user-avatar" style="width:34px;height:34px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue);border:2px solid var(--blue);overflow:hidden;cursor:pointer"></div>
      <span id="nav-user-name" style="font-size:.88rem;font-weight:600;color:var(--blue)"></span>
      <a href="/pages/chat.html" id="nav-chat-btn" class="btn btn-ghost btn-sm" style="display:none" title="Съобщения">💬</a>
      <a href="/pages/dashboard.html" class="btn btn-ghost btn-sm">Табло</a>
      <a id="nav-admin-link" href="/pages/admin.html" class="btn btn-ghost btn-sm" style="display:none">⚙ Админ</a>
      <button onclick="logout()" class="btn btn-ghost btn-sm">Изход</button>
    </div>
  </div>
</nav>

<div style="padding-top:68px">
  <div class="page-hero"><h1>👤 Моят профил</h1><p>Редактирай своя клиентски профил</p></div>
  <div class="profile-wrap">
    <div class="profile-card-big">
      <!-- AVATAR -->
      <div class="avatar-section">
        <div class="big-avatar" id="big-av" onclick="document.getElementById('av-file').click()" title="Кликни за смяна">👤</div>
        <input type="file" id="av-file" accept="image/*" style="display:none" onchange="previewAndUpload(this)"/>
        <div class="avatar-hint">Кликни върху снимката за промяна (макс. 5MB)</div>
        <div id="av-status" class="alert" style="margin-top:10px;width:100%"></div>
      </div>

      <h3 style="font-family:Sora,sans-serif;font-weight:700;margin-bottom:16px">Информация за акаунта</h3>

      <div id="main-alert" class="alert"></div>

      <div class="form-group">
        <label>Пълно име *</label>
        <input id="full-name" placeholder="Иван Иванов" type="text"/>
      </div>

      <div class="form-group">
        <label>Имейл адрес</label>
        <input id="email-display" type="email" disabled style="background:var(--g100);color:var(--g500);cursor:not-allowed"/>
      </div>

      <div style="margin-bottom:18px">
        <div class="info-row">
          <span class="label">Роля</span>
          <span class="value" id="role-display">—</span>
        </div>
        <div class="info-row">
          <span class="label">Регистриран</span>
          <span class="value" id="date-display">—</span>
        </div>
      </div>

      <button class="btn btn-primary btn-full" style="padding:13px;font-size:1rem" onclick="saveProfile()">
        💾 Запази промените
      </button>

      <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--g200);display:flex;gap:10px;flex-wrap:wrap">
        <a href="/pages/dashboard.html" class="btn btn-ghost" style="flex:1;padding:11px;justify-content:center">← Обратно към таблото</a>
        <a href="/pages/browse-services.html" class="btn btn-outline" style="flex:1;padding:11px;justify-content:center">🛍 Разгледай оферти</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script>
const user = Auth.user();
if (!user) window.location.href = '/index.html';

async function loadProfile() {
  try {
    const data = await apiFetch('/users/me');
    document.getElementById('full-name').value     = data.fullName || '';
    document.getElementById('email-display').value = data.email    || '';
    document.getElementById('role-display').textContent = { Client:'Клиент', Freelancer:'Фрийлансър', Admin:'Администратор', SuperAdmin:'Супер Администратор' }[data.role] || data.role;
    document.getElementById('date-display').textContent = data.createdAt?.slice(0,10) || '—';

    const av = document.getElementById('big-av');
    if (data.avatar) {
      av.innerHTML = `<img src="http://localhost:5000${data.avatar}" alt=""/>`;
    }
  } catch(e) { showAlert('main-alert', e.message); }
}

function previewAndUpload(input) {
  const file = input.files[0];
  if (!file) return;

  // Preview immediately
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('big-av').innerHTML = `<img src="${e.target.result}" alt=""/>`;
  };
  reader.readAsDataURL(file);

  // Upload
  uploadAvatar(file);
}

async function uploadAvatar(file) {
  const fd = new FormData();
  fd.append('avatar', file);
  try {
    const data = await apiFetch('/users/avatar', { method:'POST', body: fd });
    const saved = Auth.user();
    saved.avatar = data.avatar;
    localStorage.setItem('sk_user', JSON.stringify(saved));
    showAlert('av-status','✅ Снимката е качена успешно!','success');
    buildNav();
  } catch(e) { showAlert('av-status', e.message); }
}

async function saveProfile() {
  hideAlert('main-alert');
  const fullName = document.getElementById('full-name').value.trim();
  if (!fullName) return showAlert('main-alert','Името е задължително.');
  try {
    await apiFetch('/users/me', { method:'PUT', body: JSON.stringify({ fullName }) });
    // Update localStorage
    const saved = Auth.user();
    saved.name = fullName;
    localStorage.setItem('sk_user', JSON.stringify(saved));
    buildNav();
    showAlert('main-alert','✅ Профилът е обновен!','success');
  } catch(e) { showAlert('main-alert', e.message); }
}

loadProfile();
</script>
</body>
</html>
