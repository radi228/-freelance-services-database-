<script>
const user = Auth.user();
if (!user || user.role !== 'Freelancer') window.location.href = '/index.html';

let allBids = [];
let currentFilter = 'all';

async function load() {
  const el = document.getElementById('bids-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    allBids = await apiFetch('/bids/mine');

  } catch(e) {

}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const el = document.getElementById('bids-list');
  let list = currentFilter === 'all' ? allBids : allBids.filter(b => b.status === currentFilter);

  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="icon">ðŸ“­</div>
      <p>${currentFilter === 'all' ? 'ÐÑÐ¼Ð°Ñˆ Ð¿Ð¾Ð´Ð°Ð´ÐµÐ½Ð¸ Ð¾Ñ„ÐµÑ€Ñ‚Ð¸.' : 'ÐÑÐ¼Ð° Ð¾Ñ„ÐµÑ€Ñ‚Ð¸ Ð² Ñ‚Ð°Ð·Ð¸ ÐºÐ°Ñ‚ÐµÐ³Ð¾Ñ€Ð¸Ñ.'}</p>

  const statusBadge = { Pending:'badge-orange', Accepted:'badge-green', Rejected:'badge-red' };

  el.innerHTML = list.map(b => `
    <div class="bid-card ${statusClass[b.status]||''}">
      <div class="bid-header">
        <div>
          <div class="bid-proj">${b.projectTitle}</div>
          <div style="color:var(--g500);font-size:.8rem;margin-top:3px">ÐŸÐ¾Ð´Ð°Ð´ÐµÐ½Ð°: ${b.createdAt?.slice(0,10)}</div>
        </div>

      </div>
      <div class="bid-meta">
        <span>ðŸ’° <strong>${b.amount} â‚¬</strong></span>
        <span>â± <strong>${b.deliveryDays} Ð´Ð½Ð¸</strong> ÑÑ€Ð¾Ðº</span>
      </div>
      ${b.coverLetter ? `<div class="bid-letter">"${b.coverLetter}"</div>` : ''}
      <div class="bid-actions">
        ${b.status === 'Pending' ? `
          <button class="btn btn-primary btn-sm" onclick="openEdit(${b.id},'${b.projectTitle.replace(/'/g,"\\'")}',${b.amount},${b.deliveryDays},'${(b.coverLetter||'').replace(/'/g,"\\'").replace(/\n/g,' ')}')">

        ` : ''}

      </div>
    </div>`).join('');
}

function openEdit(id, title, amount, days, letter) {
  document.getElementById('edit-bid-id').value = id;
  document.getElementById('edit-bid-proj-title').textContent = title;
  document.getElementById('edit-amount').value = amount;
  document.getElementById('edit-days').value   = days;
  document.getElementById('edit-letter').value = letter;
  hideAlert('edit-bid-alert');
  openModal('edit-bid-modal');
}

async function saveEditedBid() {
  hideAlert('edit-bid-alert');
  const id      = document.getElementById('edit-bid-id').value;
  const amount  = parseFloat(document.getElementById('edit-amount').value);
  const days    = parseInt(document.getElementById('edit-days').value);
  const letter  = document.getElementById('edit-letter').value.trim();

  if (!amount || amount < 1) return showAlert('edit-bid-alert','Ð’ÑŠÐ²ÐµÐ´Ð¸ Ð²Ð°Ð»Ð¸Ð´Ð½Ð° ÑÑƒÐ¼Ð°.');
  if (!days || days < 1)    return showAlert('edit-bid-alert','Ð’ÑŠÐ²ÐµÐ´Ð¸ Ð²Ð°Ð»Ð¸Ð´ÐµÐ½ ÑÑ€Ð¾Ðº.');

  try {
    await apiFetch(`/bids/${id}`, { method:'PUT', body: JSON.stringify({ amount, deliveryDays: days, coverLetter: letter }) });

    showAlert('global-alert','âœ… ÐžÑ„ÐµÑ€Ñ‚Ð°Ñ‚Ð° Ðµ Ð¾Ð±Ð½Ð¾Ð²ÐµÐ½Ð°!','success');

}
