<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Мои оферти – Skillo</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .bid-card{background:#fff;border-radius:var(--rl);padding:24px;border:2px solid var(--g200);box-shadow:var(--sh);margin-bottom:16px;transition:all .2s}
    .bid-card:hover{border-color:var(--blue);box-shadow:var(--shl)}
    .bid-card.accepted{border-color:#16A34A;background:#F0FDF4}
    .bid-card.rejected{border-color:#DC2626;background:#FEF2F2;opacity:.75}
    .bid-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
    .bid-proj{font-family:'Sora',sans-serif;font-weight:800;font-size:1.05rem}
    .bid-meta{display:flex;gap:16px;font-size:.84rem;color:var(--g700);margin-bottom:12px;flex-wrap:wrap}
    .bid-meta span{display:flex;align-items:center;gap:5px}
    .bid-letter{color:var(--g500);font-size:.88rem;line-height:1.65;padding:12px;background:var(--g100);border-radius:var(--r);margin-bottom:14px}
    .bid-actions{display:flex;gap:8px;flex-wrap:wrap}
    .filter-tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
    .filter-tab{padding:7px 18px;border-radius:50px;border:2px solid var(--g200);background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:.85rem;color:var(--g500);transition:all .18s}
    .filter-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
  </style>
</head>
<body>
<nav id="main-nav">
  <a href="/index.html" class="logo"><div class="logo-icon">🚀</div><span class="logo-text">Skill<span class="accent">o</span></span></a>
  <ul class="nav-links"></ul>
  <div class="nav-cta">
    <a href="#" id="nav-login-btn" class="btn btn-outline btn-sm" onclick="window.location='/index.html#login';return false">Вход</a>
    <a href="#" id="nav-register-btn" class="btn btn-orange btn-sm" onclick="window.location='/index.html#register';return false">Регистрация</a>
    <div id="nav-user" style="display:none;align-items:center;gap:8px">
      <div id="nav-user-avatar" style="width:34px;height:34px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue);border:2px solid var(--blue);overflow:hidden;cursor:pointer"></div>
      <span id="nav-user-name" style="font-size:.88rem;font-weight:600;color:var(--blue)"></span>
      <a href="/pages/chat.html" id="nav-chat-btn" style="display:none;position:relative;width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;align-items:center;justify-content:center;font-size:1rem;text-decoration:none;flex-shrink:0" title="Съобщения">
        <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);line-height:1">💬</span>
        <span id="chat-badge" style="display:none;position:absolute;top:-5px;right:-5px;background:#e53e3e;color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:.6rem;font-weight:800;align-items:center;justify-content:center;border:2px solid #fff;padding:0 2px">0</span>
      </a>
      <a href="/pages/dashboard.html" class="btn btn-ghost btn-sm">Табло</a>
      <a id="nav-admin-link" href="/pages/admin.html" class="btn btn-ghost btn-sm" style="display:none">⚙ Админ</a>
      <button onclick="logout()" class="btn btn-ghost btn-sm">Изход</button>
    </div>
  </div>
</nav>

<div class="page-hero">
  <h1>📨 Мои оферти</h1>
  <p>Управлявай и редактирай подадените от теб оферти</p>
</div>

<div class="page-wrap" style="padding-top:36px">
  <div id="global-alert" class="alert" style="margin-bottom:16px"></div>

  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all',this)">Всички</button>
    <button class="filter-tab" onclick="setFilter('Pending',this)">⏳ Чакащи</button>
    <button class="filter-tab" onclick="setFilter('Accepted',this)">✅ Приети</button>
    <button class="filter-tab" onclick="setFilter('Rejected',this)">❌ Отказани</button>
  </div>

  <div id="bids-list">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- EDIT BID MODAL -->
<div class="modal-overlay" id="edit-bid-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('edit-bid-modal')">✕</button>
    <h2>Редактирай оферта</h2>
    <p class="modal-sub" id="edit-bid-proj-title" style="color:var(--blue);font-weight:600"></p>
    <div id="edit-bid-alert" class="alert"></div>
    <input type="hidden" id="edit-bid-id"/>
    <div class="form-row">
      <div class="form-group">
        <label>Сума (лв) *</label>
        <input id="edit-amount" type="number" min="1"/>
      </div>
      <div class="form-group">
        <label>Срок (дни) *</label>
        <input id="edit-days" type="number" min="1"/>
      </div>
    </div>
    <div class="form-group">
      <label>Мотивационно писмо</label>
      <textarea id="edit-letter" rows="5" placeholder="Опиши защо си подходящ за проекта…"></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary btn-full" style="padding:13px" onclick="saveEditedBid()">💾 Запази промените</button>
      <button class="btn btn-ghost" style="padding:13px 18px" onclick="closeModal('edit-bid-modal')">Откажи</button>
    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script>
const user = Auth.user();
if (!user || user.role !== 'Freelancer') window.location.href = '/index.html';

let allBids = [];
let currentFilter = 'all';

async function load() {
  const el = document.getElementById('bids-list');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    allBids = await apiFetch('/bids/mine');
    render();
  } catch(e) {
    el.innerHTML = `<div class="empty"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
  }
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const el = document.getElementById('bids-list');
  let list = currentFilter === 'all' ? allBids : allBids.filter(b => b.status === currentFilter);

  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="icon">📭</div>
      <p>${currentFilter === 'all' ? 'Нямаш подадени оферти.' : 'Няма оферти в тази категория.'}</p>
      <a href="/pages/projects.html" class="btn btn-primary" style="margin-top:14px">Разгледай проекти</a>
    </div>`;
    return;
  }

  const statusClass = { Pending:'', Accepted:'accepted', Rejected:'rejected' };
  const statusLabel = { Pending:'⏳ Чака отговор', Accepted:'✅ Приета', Rejected:'❌ Отказана' };
  const statusBadge = { Pending:'badge-orange', Accepted:'badge-green', Rejected:'badge-red' };

  el.innerHTML = list.map(b => `
    <div class="bid-card ${statusClass[b.status]||''}">
      <div class="bid-header">
        <div>
          <div class="bid-proj">${b.projectTitle}</div>
          <div style="color:var(--g500);font-size:.8rem;margin-top:3px">Подадена: ${b.createdAt?.slice(0,10)}</div>
        </div>
        <span class="badge ${statusBadge[b.status]||'badge-gray'}">${statusLabel[b.status]||b.status}</span>
      </div>
      <div class="bid-meta">
        <span>💰 <strong>${b.amount} €</strong></span>
        <span>⏱ <strong>${b.deliveryDays} дни</strong> срок</span>
      </div>
      ${b.coverLetter ? `<div class="bid-letter">"${b.coverLetter}"</div>` : ''}
      <div class="bid-actions">
        ${b.status === 'Pending' ? `
          <button class="btn btn-primary btn-sm" onclick="openEdit(${b.id},'${b.projectTitle.replace(/'/g,"\\'")}',${b.amount},${b.deliveryDays},'${(b.coverLetter||'').replace(/'/g,"\\'").replace(/\n/g,' ')}')">
            ✏ Редактирай
          </button>
          <button class="btn btn-danger btn-sm" onclick="deleteBid(${b.id})">🗑 Оттегли</button>
        ` : ''}
        <a href="/pages/projects.html?id=${b.projectId}" class="btn btn-ghost btn-sm">📋 Виж проекта</a>
      </div>
    </div>`).join('');
}

function openEdit(id, title, amount, days, letter) {
  document.getElementById('edit-bid-id').value = id;
  document.getElementById('edit-bid-proj-title').textContent = title;
  document.getElementById('edit-amount').value = amount;
  document.getElementById('edit-days').value   = days;
  document.getElementById('edit-letter').value = letter;
  hideAlert('edit-bid-alert');
  openModal('edit-bid-modal');
}

async function saveEditedBid() {
  hideAlert('edit-bid-alert');
  const id      = document.getElementById('edit-bid-id').value;
  const amount  = parseFloat(document.getElementById('edit-amount').value);
  const days    = parseInt(document.getElementById('edit-days').value);
  const letter  = document.getElementById('edit-letter').value.trim();

  if (!amount || amount < 1) return showAlert('edit-bid-alert','Въведи валидна сума.');
  if (!days || days < 1)    return showAlert('edit-bid-alert','Въведи валиден срок.');

  try {
    await apiFetch(`/bids/${id}`, { method:'PUT', body: JSON.stringify({ amount, deliveryDays: days, coverLetter: letter }) });
    closeModal('edit-bid-modal');
    showAlert('global-alert','✅ Офертата е обновена!','success');
    await load();
  } catch(e) { showAlert('edit-bid-alert', e.message); }
}

async function deleteBid(id) {
  if (!confirm('Сигурен ли си, че искаш да оттеглиш тази оферта?')) return;
  try {
    await apiFetch(`/bids/${id}`, { method:'DELETE' });
    showAlert('global-alert','🗑 Офертата е оттеглена.','success');
    await load();
  } catch(e) { showAlert('global-alert', e.message); }
}

load();
</script>
<script src="/js/i18n.js"></script>
</body>
</html>
