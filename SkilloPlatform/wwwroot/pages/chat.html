<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Чат – Skillo</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/main.css"/>
  <style>
    .chat-layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 68px);overflow:hidden}
    .conv-sidebar{border-right:1px solid var(--g200);display:flex;flex-direction:column;background:#fff}
    .conv-header{padding:16px 20px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between}
    .conv-header h3{font-family:'Sora',sans-serif;font-weight:700;font-size:1rem}
    .conv-search{padding:10px 14px;border-bottom:1px solid var(--g200)}
    .conv-search input{width:100%;padding:8px 12px;border:2px solid var(--g200);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none}
    .conv-search input:focus{border-color:var(--blue)}
    .conv-list{flex:1;overflow-y:auto}
    .conv-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:.18s;border-bottom:1px solid var(--g100)}
    .conv-item:hover{background:var(--g100)}
    .conv-item.active{background:rgba(27,95,168,.08)}
    .conv-av{width:42px;height:42px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue);font-size:.9rem;flex-shrink:0;overflow:hidden;border:2px solid var(--g200)}
    .conv-av img{width:100%;height:100%;object-fit:cover}
    .conv-info{flex:1;min-width:0}
    .conv-name{font-weight:700;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-last{font-size:.76rem;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-time{font-size:.72rem;color:var(--g500);flex-shrink:0}
    .chat-main{display:flex;flex-direction:column;background:var(--g100)}
    .chat-empty{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:14px;color:var(--g500)}
    .chat-empty .icon{font-size:3rem}
    .chat-top{background:#fff;border-bottom:1px solid var(--g200);padding:14px 20px;display:flex;align-items:center;gap:12px}
    .chat-top-av{width:38px;height:38px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue);overflow:hidden;border:2px solid var(--g200)}
    .chat-top-av img{width:100%;height:100%;object-fit:cover}
    .chat-top-name{font-family:'Sora',sans-serif;font-weight:700;font-size:.95rem}
    .chat-top-role{font-size:.76rem;color:var(--g500)}
    .chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
    .msg{display:flex;gap:10px;max-width:70%;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .msg.own{align-self:flex-end;flex-direction:row-reverse}
    .msg-av{width:32px;height:32px;border-radius:50%;background:var(--g200);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.75rem;color:var(--blue);flex-shrink:0;overflow:hidden}
    .msg-av img{width:100%;height:100%;object-fit:cover}
    .msg-bubble{background:#fff;border-radius:18px;border-bottom-left-radius:4px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.06);max-width:100%}
    .msg.own .msg-bubble{background:var(--blue);color:#fff;border-radius:18px;border-bottom-right-radius:4px}
    .msg-text{font-size:.9rem;line-height:1.5;word-break:break-word}
    .msg-time{font-size:.7rem;color:var(--g500);margin-top:4px}
    .msg.own .msg-time{color:rgba(255,255,255,.6);text-align:right}
    .msg-sender{font-size:.72rem;font-weight:700;color:var(--blue);margin-bottom:3px}
    .msg.own .msg-sender{display:none}
    .chat-input-area{background:#fff;border-top:1px solid var(--g200);padding:14px 20px;display:flex;gap:10px;align-items:flex-end}
    .chat-input-area textarea{flex:1;border:2px solid var(--g200);border-radius:22px;padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:.9rem;outline:none;resize:none;max-height:120px;transition:.2s;line-height:1.5}
    .chat-input-area textarea:focus{border-color:var(--blue)}
    .send-btn{width:42px;height:42px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;transition:.2s}
    .send-btn:hover{background:var(--blue-dark);transform:scale(1.05)}
    .date-divider{text-align:center;margin:10px 0}
    .date-divider span{background:var(--g200);color:var(--g500);font-size:.72rem;padding:3px 10px;border-radius:20px}
    .support-badge{padding:2px 8px;border-radius:20px;background:rgba(246,166,35,.15);color:var(--orange-dark);font-size:.72rem;font-weight:700;margin-left:6px}
    @media(max-width:700px){.chat-layout{grid-template-columns:1fr}.conv-sidebar{display:none}.conv-sidebar.mobile-show{display:flex;position:fixed;inset:68px 0 0 0;z-index:100}}
  </style>
</head>
<body>
<nav id="main-nav">
  <a href="/index.html" class="logo"><div class="logo-icon">🚀</div><span class="logo-text">Skill<span class="accent">o</span></span></a>
  <ul class="nav-links"></ul>
  <div class="nav-cta">
    <a href="#" id="nav-login-btn" class="btn btn-outline btn-sm" onclick="window.location='/index.html#login';return false">Вход</a>
    <a href="#" id="nav-register-btn" class="btn btn-orange btn-sm" onclick="window.location='/index.html#register';return false">Регистрация</a>
    <div id="nav-user" style="display:none;align-items:center;gap:8px">
      <div id="nav-user-avatar" style="width:34px;height:34px;border-radius:50%;background:var(--g100);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--blue);border:2px solid var(--blue);overflow:hidden;cursor:pointer"></div>
      <span id="nav-user-name" style="font-size:.88rem;font-weight:600;color:var(--blue)"></span>
      <a href="/pages/chat.html" id="nav-chat-btn" class="btn btn-ghost btn-sm" style="display:none" title="Съобщения">💬</a>
      <a href="/pages/dashboard.html" class="btn btn-ghost btn-sm">Табло</a>
      <a id="nav-admin-link" href="/pages/admin.html" class="btn btn-ghost btn-sm" style="display:none">⚙ Админ</a>
      <button onclick="logout()" class="btn btn-ghost btn-sm">Изход</button>
    </div>
  </div>
</nav>

<div style="padding-top:68px;height:100vh;display:flex;flex-direction:column">
  <div class="chat-layout">
    <!-- SIDEBAR -->
    <div class="conv-sidebar">
      <div class="conv-header">
        <h3>💬 Съобщения</h3>
        <button class="btn btn-primary btn-sm" onclick="openNewChat()">+ Нов</button>
      </div>
      <div class="conv-search">
        <input id="conv-search" type="text" placeholder="Търси разговор…" oninput="filterConvs()"/>
      </div>
      <!-- Support tab for admins -->
      <div id="admin-tabs" style="display:none;border-bottom:1px solid var(--g200)">
        <div style="display:flex">
          <button id="tab-mine" class="tab-btn active" onclick="showTab('mine')" style="flex:1">Мои</button>
          <button id="tab-support" class="tab-btn" onclick="showTab('support')" style="flex:1">🛟 Поддръжка</button>
        </div>
      </div>
      <div class="conv-list" id="conv-list">
        <div class="loading" style="padding:28px;text-align:center"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-main" id="chat-main">
      <div class="chat-empty" id="chat-empty">
        <div class="icon">💬</div>
        <p style="font-family:'Sora',sans-serif;font-weight:700">Избери разговор</p>
        <p style="font-size:.88rem">или започни нов с фрийлансър или клиент</p>
        <button class="btn btn-primary" onclick="openNewChat()">+ Нов разговор</button>
      </div>
      <div id="chat-window" style="display:none;flex-direction:column;height:100%">
        <div class="chat-top" id="chat-top"></div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
          <textarea id="msg-input" placeholder="Напиши съобщение…" rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
          <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- NEW CHAT MODAL -->
<div class="modal-overlay" id="new-chat-modal">
  <div class="modal" style="max-width:460px">
    <button class="modal-close" onclick="closeModal('new-chat-modal')">✕</button>
    <h2>Нов разговор</h2>
    <p class="modal-sub">Търси потребител по имейл или избери от препоръките</p>
    <div id="nc-alert" class="alert"></div>
    <div class="form-group">
      <label>Имейл на потребителя</label>
      <input id="nc-email" type="email" placeholder="ivan@example.com" oninput="searchUser()"/>
    </div>
    <div id="nc-results" style="margin-top:10px"></div>
    <!-- Support button -->
    <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--g200)">
      <button class="btn btn-ghost btn-full" onclick="startSupportChat()">🛟 Свържи се с поддръжка</button>
    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script>
const user = Auth.user();
if (!user) window.location.href = '/index.html';

let currentConvId = null;
let allConvs = [];
let pollInterval = null;
let lastMessageId = 0;

// Show admin tabs
if (Auth.isAdmin()) {
  document.getElementById('admin-tabs').style.display = 'block';
}

async function loadConversations() {
  try {
    const convs = await apiFetch('/chat/conversations');
    allConvs = Array.isArray(convs) ? convs : [];
    renderConvList(allConvs);

    // Open from URL param
    const urlConvId = new URLSearchParams(location.search).get('conv');
    if (urlConvId) openConversation(parseInt(urlConvId));
  } catch(e) {
    document.getElementById('conv-list').innerHTML = `<p style="padding:20px;color:var(--g500)">${e.message}</p>`;
  }
}

function renderConvList(convs) {
  const el = document.getElementById('conv-list');
  if (!convs.length) {
    el.innerHTML = '<div class="empty" style="padding:28px"><div class="icon">💬</div><p>Нямаш разговори.</p></div>';
    return;
  }
  el.innerHTML = convs.map(c => {
    const av = c.otherAvatar
      ? `<img src="http://localhost:5000${c.otherAvatar}" alt=""/>`
      : c.otherUserName[0];
    const time = c.lastMessageAt ? new Date(c.lastMessageAt).toLocaleTimeString('bg-BG', {hour:'2-digit',minute:'2-digit'}) : '';
    return `
    <div class="conv-item ${currentConvId===c.id?'active':''}" onclick="openConversation(${c.id})">
      <div class="conv-av">${av}</div>
      <div class="conv-info">
        <div class="conv-name">${c.otherUserName}${c.isSupport?'<span class="support-badge">Поддръжка</span>':''}</div>
        <div class="conv-last">${c.lastMessage || 'Няма съобщения'}</div>
      </div>
      <div class="conv-time">${time}</div>
    </div>`;
  }).join('');
}

function filterConvs() {
  const q = document.getElementById('conv-search').value.toLowerCase();
  renderConvList(allConvs.filter(c => c.otherUserName.toLowerCase().includes(q)));
}

async function openConversation(convId) {
  currentConvId = convId;
  const conv = allConvs.find(c => c.id === convId);
  if (!conv) return;

  // Update active state
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.conv-item').forEach(el => {
    if (el.onclick?.toString().includes(convId)) el.classList.add('active');
  });

  // Show chat window
  document.getElementById('chat-empty').style.display = 'none';
  const win = document.getElementById('chat-window');
  win.style.display = 'flex';

  // Header
  const av = conv.otherAvatar
    ? `<img src="http://localhost:5000${conv.otherAvatar}" alt=""/>`
    : conv.otherUserName[0];
  const roleLabel = {Client:'Клиент',Freelancer:'Фрийлансър',Admin:'Администратор',SuperAdmin:'Супер Администратор'}[conv.otherRole]||conv.otherRole;
  document.getElementById('chat-top').innerHTML = `
    <div class="chat-top-av">${av}</div>
    <div>
      <div class="chat-top-name">${conv.otherUserName}${conv.isSupport?'<span class="support-badge">Поддръжка</span>':''}</div>
      <div class="chat-top-role">${roleLabel}</div>
    </div>`;

  // Load messages
  await loadMessages(convId);

  // Start polling for new messages
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(() => pollMessages(convId), 3000);

  // Focus input
  document.getElementById('msg-input').focus();
}

async function loadMessages(convId) {
  try {
    const msgs = await apiFetch(`/chat/conversations/${convId}/messages`);
    const msgArr = Array.isArray(msgs) ? msgs : [];
    renderMessages(msgArr);
    if (msgArr.length) lastMessageId = msgArr[msgArr.length-1].id;
  } catch(e) { console.error(e); }
}

async function pollMessages(convId) {
  if (convId !== currentConvId) return;
  try {
    const msgs = await apiFetch(`/chat/conversations/${convId}/messages`);
    const msgArr = Array.isArray(msgs) ? msgs : [];
    const newMsgs = msgArr.filter(m => m.id > lastMessageId);
    if (newMsgs.length) {
      newMsgs.forEach(m => appendMessage(m));
      lastMessageId = newMsgs[newMsgs.length-1].id;
      scrollToBottom();
    }
  } catch {}
}

function renderMessages(msgs) {
  const el = document.getElementById('chat-messages');
  if (!msgs.length) { el.innerHTML = '<div style="text-align:center;padding:28px;color:var(--g500)">Няма съобщения. Кажи нещо! 👋</div>'; return; }

  let lastDate = '';
  el.innerHTML = msgs.map(m => {
    const date = new Date(m.createdAt).toLocaleDateString('bg-BG');
    const dateDiv = date !== lastDate ? `<div class="date-divider"><span>${date}</span></div>` : '';
    lastDate = date;
    const time = new Date(m.createdAt).toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'});
    const av = m.senderAvatar ? `<img src="http://localhost:5000${m.senderAvatar}" alt=""/>` : m.senderName[0];
    return `${dateDiv}
    <div class="msg ${m.isOwn?'own':''}">
      <div class="msg-av">${av}</div>
      <div>
        ${!m.isOwn?`<div class="msg-sender">${m.senderName}</div>`:''}
        <div class="msg-bubble"><div class="msg-text">${escapeHtml(m.content)}</div><div class="msg-time">${time}</div></div>
      </div>
    </div>`;
  }).join('');
  scrollToBottom();
}

function appendMessage(m) {
  const el = document.getElementById('chat-messages');
  const time = new Date(m.createdAt).toLocaleTimeString('bg-BG',{hour:'2-digit',minute:'2-digit'});
  const av = m.senderAvatar ? `<img src="http://localhost:5000${m.senderAvatar}" alt=""/>` : m.senderName[0];
  const div = document.createElement('div');
  div.innerHTML = `
    <div class="msg ${m.isOwn?'own':''}">
      <div class="msg-av">${av}</div>
      <div>
        ${!m.isOwn?`<div class="msg-sender">${m.senderName}</div>`:''}
        <div class="msg-bubble"><div class="msg-text">${escapeHtml(m.content)}</div><div class="msg-time">${time}</div></div>
      </div>
    </div>`;
  el.appendChild(div.firstElementChild);
}

function scrollToBottom() {
  const el = document.getElementById('chat-messages');
  el.scrollTop = el.scrollHeight;
}

async function sendMsg() {
  if (!currentConvId) return;
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content) return;

  try {
    // Send via REST API
    await apiFetch(`/chat/conversations/${currentConvId}/send`, {
      method: 'POST',
      body: JSON.stringify({ content })
    });
    input.value = '';
    input.style.height = 'auto';
    await loadMessages(currentConvId);
  } catch(e) {
    // Fallback: show message optimistically
    const now = new Date();
    appendMessage({
      id: Date.now(),
      senderId: user.id,
      senderName: user.name,
      senderAvatar: user.avatar,
      content,
      createdAt: now.toISOString(),
      isOwn: true,
    });
    input.value = '';
    input.style.height = 'auto';
    scrollToBottom();
  }
}

// ── New chat ──────────────────────────────────────
function openNewChat() {
  document.getElementById('nc-email').value = '';
  document.getElementById('nc-results').innerHTML = '';
  hideAlert('nc-alert');
  openModal('new-chat-modal');
}

let searchTimeout;
async function searchUser() {
  clearTimeout(searchTimeout);
  const email = document.getElementById('nc-email').value.trim();
  if (email.length < 3) { document.getElementById('nc-results').innerHTML = ''; return; }

  searchTimeout = setTimeout(async () => {
    try {
      const results = await apiFetch(`/chat/search-users?q=${encodeURIComponent(email)}`);
      const arr = Array.isArray(results) ? results : [];
      document.getElementById('nc-results').innerHTML = arr.length ? arr.map(u => `
        <div class="conv-item" style="border:1px solid var(--g200);border-radius:var(--r);margin-bottom:8px" onclick="startChat(${u.id},'${u.fullName.replace(/'/g,"\\'")}')">
          <div class="conv-av">${u.avatar ? `<img src="http://localhost:5000${u.avatar}" alt=""/>` : u.fullName[0]}</div>
          <div class="conv-info">
            <div class="conv-name">${u.fullName}</div>
            <div class="conv-last">${u.email} · ${u.role}</div>
          </div>
          <span class="btn btn-primary btn-sm">Чат</span>
        </div>`).join('')
        : '<p style="color:var(--g500);font-size:.85rem">Не е намерен потребител.</p>';
    } catch {}
  }, 400);
}

async function startChat(otherUserId, name) {
  try {
    const data = await apiFetch('/chat/conversations', {
      method: 'POST',
      body: JSON.stringify({ otherUserId })
    });
    closeModal('new-chat-modal');
    await loadConversations();
    openConversation(data.id);
  } catch(e) { showAlert('nc-alert', e.message); }
}

async function startSupportChat() {
  try {
    // Find admin user
    const admins = await apiFetch('/chat/find-admin');
    if (!admins?.id) { showAlert('nc-alert', 'Няма достъпен администратор.'); return; }
    await startChat(admins.id, admins.fullName);
  } catch(e) { showAlert('nc-alert', 'Поддръжката временно не е достъпна.'); }
}

function showTab(tab) {
  document.getElementById('tab-mine').classList.toggle('active', tab==='mine');
  document.getElementById('tab-support').classList.toggle('active', tab==='support');
  if (tab === 'mine') loadConversations();
  else loadSupportConvs();
}

async function loadSupportConvs() {
  try {
    const convs = await apiFetch('/chat/support');
    allConvs = Array.isArray(convs) ? convs.map(c => ({
      id: c.id,
      otherUserId: c.userId,
      otherUserName: c.userName,
      otherAvatar: c.userAvatar,
      otherRole: c.userRole,
      lastMessage: c.lastMessage,
      lastMessageAt: c.updatedAt,
      isSupport: true,
    })) : [];
    renderConvList(allConvs);
  } catch(e) { console.error(e); }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.appendChild(document.createTextNode(text));
  return div.innerHTML;
}

// Check for ?start=userId in URL to auto-start conversation
const urlParams = new URLSearchParams(location.search);
const startUserId = urlParams.get('start');
if (startUserId) {
  document.addEventListener('DOMContentLoaded', async () => {
    await loadConversations();
    await startChat(parseInt(startUserId), '');
  });
} else {
  loadConversations();
}
</script>
</body>
</html>
